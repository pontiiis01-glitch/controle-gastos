<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Financeiro 38.0 (Final)</title>

    <link rel="icon" type="image/png" href="icone2.0.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary: #2563eb; --bg-body: #f8fafc; --bg-card: #ffffff; 
            --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }
        [data-theme="dark"] {
            --primary: #60a5fa; --bg-body: #0f172a; --bg-card: #1e293b; 
            --text-main: #f1f5f9; --text-muted: #94a3b8; --border: #334155;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* LAYOUT */
        #sidebar { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px; z-index: 100; transition: 0.3s; }
        #main-content { flex: 1; overflow-y: auto; padding: 20px; position: relative; }
        
        .mobile-toggle { display: none; position: absolute; top: 15px; left: 15px; z-index: 200; background: var(--bg-card); padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: -300px; height: 100%; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
            #sidebar.active { transform: translateX(300px); }
            .mobile-toggle { display: block; }
            #main-content { padding-top: 70px; }
        }

        /* COMPONENTES */
        .brand { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 12px; width: 100%; text-align: left; font-weight: 600; cursor: pointer; border-radius: 8px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .nav-btn:hover { background: rgba(37,99,235,0.1); color: var(--primary); }
        .nav-btn.active { background: var(--primary); color: white; }
        
        .config-area { margin-bottom: 20px; }
        .menu-divider { height: 1px; background: var(--border); margin: 15px 0; }

        .controls-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .date-control { background: var(--bg-card); border: 1px solid var(--border); padding: 8px 15px; border-radius: 50px; display: flex; align-items: center; gap: 10px; }
        input[type="month"] { background: transparent; border: none; font-weight: 700; color: inherit; cursor: pointer; }

        .btn-action { padding: 8px 16px; border-radius: 50px; border: none; color: white; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-copy { background: #3b82f6; } .btn-reset { background: #ef4444; } .btn-pdf { background: #10b981; } .btn-save { background: #f59e0b; }

        /* DASHBOARD */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card-stat { background: var(--bg-card); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
        .stat-input { width: 100%; font-size: 1.4rem; font-weight: 800; background: transparent; border: none; border-bottom: 2px dashed var(--border); color: inherit; }
        .val { font-size: 1.4rem; font-weight: 800; }
        .c-salary input { color: var(--success); } .c-total .val { color: var(--danger); } 

        /* TABELAS */
        .section { background: var(--bg-card); border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
        .sec-header { padding: 15px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; }
        .sec-body { padding: 15px; }
        
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
        
        /* INPUTS DA TABELA - ESSENCIAIS */
        .input-nome, .input-desc, .input-inst { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-body); color: inherit; }
        .input-val { width: 100px; padding: 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-body); color: inherit; font-weight: bold; }
        
        /* CARTÕES */
        .card-row { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); gap: 15px; }
        .card-thumb { width: 100px; height: 63px; border-radius: 8px; background-size: cover; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .thumb-bb { background-image: url('bb.jpeg'); background-color: #fcd34d; }
        .thumb-mp { background-image: url('mp.jpeg'); background-color: #3b82f6; }
        .thumb-passai { background-image: url('passai.jpeg'); background-color: #f97316; }
        .thumb-nubank { background-image: url('nubank.jpeg'); background-color: #a855f7; }

        /* UTILITARIOS */
        #loadingOverlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 999; display: none; align-items: center; justify-content: center; flex-direction: column; }
        #saveToast { position: fixed; top: 20px; right: 20px; background: var(--success); color: white; padding: 10px 20px; border-radius: 50px; display: none; z-index: 1000; font-weight: bold; }
        
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #lockScreen { position: fixed; inset: 0; background: var(--bg-body); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .lock-box { background: var(--bg-card); padding: 40px; border-radius: 20px; text-align: center; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .lock-input { padding: 15px; font-size: 2rem; width: 150px; text-align: center; margin: 20px 0; border-radius: 10px; border: 2px solid var(--border); }
        
        #pdfModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .pdf-box { width: 90%; height: 90%; background: #fff; border-radius: 15px; display: flex; flex-direction: column; }
        iframe { flex: 1; border: none; }
    </style>
</head>
<body>

<div id="saveToast">✅ Salvo com Sucesso!</div>
<div id="loadingOverlay"><div style="font-size:2rem;">🔄</div><div>Carregando...</div></div>

<div id="pdfModal">
    <div class="pdf-box">
        <div style="padding:15px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between;">
            <h3>Relatório PDF</h3>
            <button class="btn-action btn-reset" onclick="document.getElementById('pdfModal').style.display='none'">Fechar</button>
        </div>
        <iframe id="pdfPreviewFrame"></iframe>
    </div>
</div>

<div id="lockScreen">
    <div class="lock-box">
        <h1>🔒</h1>
        <input type="password" id="passInput" class="lock-input" placeholder="PIN" inputmode="numeric">
        <button class="btn-action btn-copy" style="width:100%; justify-content:center;" onclick="checkPassword()">ENTRAR</button>
    </div>
</div>

<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</button>

<nav id="sidebar">
    <div class="brand">💳 Financeiro</div>
    
    <div class="config-area">
        <button class="nav-btn" onclick="toggleTheme()">🌙 Tema</button>
        <button class="nav-btn" style="color:var(--danger)" onclick="location.reload()">🔒 Bloquear</button>
    </div>
    
    <div class="menu-divider"></div>

    <button class="nav-btn active" onclick="switchView('dashboard')">📊 Resumo</button>
    <button class="nav-btn" onclick="switchView('income')">💰 Rendas e Fixos</button>
    <button class="nav-btn" onclick="switchView('cards')">💳 Cartões</button>
    <button class="nav-btn" onclick="switchView('debts')">👥 Devedores</button>
    <button class="nav-btn" onclick="switchView('history')">📈 Histórico</button>
</nav>

<main id="main-content">
    <div class="controls-row">
        <div class="date-control">📅 <input type="month" id="monthPicker" onchange="changeMonth()"></div>
        <div style="display:flex; gap:5px">
            <button class="btn-action btn-save" onclick="saveData(true)">💾 Salvar</button>
            <button class="btn-action btn-copy" onclick="copyPreviousMonth()">Importar</button>
            <button class="btn-action btn-reset" onclick="resetMonth()">🗑️ Limpar</button>
            <button class="btn-action btn-pdf" onclick="openPDF()">PDF</button>
        </div>
        <div id="syncStatus" style="color:var(--text-muted); font-size:0.8rem;">...</div>
    </div>

    <div id="view-dashboard" class="view-section active">
        <div class="dashboard-grid">
            <div class="card-stat c-salary"><h3>Salário</h3><input type="number" id="salary" class="stat-input" value="0" oninput="scheduleSave()"></div>
            <div class="card-stat c-total"><h3>Total Saídas</h3><div class="val" id="totalExpenses">R$ 0,00</div></div>
            <div class="card-stat c-rest"><h3>Livre</h3><div class="val" id="remaining">R$ 0,00</div></div>
            <div class="card-stat c-income"><h3>Extras</h3><div class="val" id="extraTotal">R$ 0,00</div></div>
            <div class="card-stat c-emerg"><h3>Reserva</h3><input type="number" id="emergency" class="stat-input" value="0" oninput="scheduleSave()"></div>
        </div>
        <div class="section"><div class="sec-body" style="height:300px; display:flex; justify-content:center;"><canvas id="chart"></canvas></div></div>
    </div>

    <div id="view-income" class="view-section">
        <div class="section">
            <div class="sec-header"><h2>Entradas Extras</h2></div>
            <div class="sec-body">
                <table id="incomeTable"><tbody></tbody></table>
                <button class="btn-action btn-copy" style="width:100%; margin-top:10px; justify-content:center;" onclick="addIncomeRow()">+ Adicionar</button>
            </div>
        </div>
        <div class="section">
            <div class="sec-header"><h2>Gastos Fixos</h2></div>
            <div class="sec-body">
                <table id="mainTable"><tbody></tbody></table>
                <button class="btn-action btn-copy" style="width:100%; margin-top:10px; justify-content:center;" onclick="addMainRow()">+ Adicionar</button>
            </div>
        </div>
    </div>

    <div id="view-cards" class="view-section">
        <div id="cardsContainer"></div> </div>

    <div id="view-debts" class="view-section">
        <div class="section">
            <div class="sec-header">
                <div>A Receber: <span id="totalReceivable" style="color:var(--danger)">R$ 0,00</span></div>
                <div>Já Pago: <span id="totalPaid" style="color:var(--success)">R$ 0,00</span></div>
            </div>
            <div class="sec-body" id="debtorsList" style="display:grid; gap:10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));"></div>
        </div>
    </div>

    <div id="view-history" class="view-section">
        <div class="section"><div class="sec-body" style="height:300px;"><canvas id="histChart"></canvas></div></div>
    </div>

</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDBcLEJw2PiFoBvocr3Zq01sRjjakteHfs",
        authDomain: "app-controle-gastos-1e658.firebaseapp.com",
        projectId: "app-controle-gastos-1e658",
        storageBucket: "app-controle-gastos-1e658.firebasestorage.app",
        messagingSenderId: "738629744462",
        appId: "1:738629744462:web:f299e491bafe5a059cd01f",
        measurementId: "G-02QPMRE4M8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const SENHA = "1234";

    let currentDocId = "";
    let saveTimer;
    let unsubscribe;
    let chartInstance = null;
    let histChartInstance = null;
    let isLocked = false; // Impede salvamento durante carregamento

    window.paidDebtors = []; // Lista de nomes pagos

    // --- INICIALIZAÇÃO ---
    window.onload = () => {
        const d = new Date();
        const m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        document.getElementById('monthPicker').value = m;
    };

    window.checkPassword = () => {
        if(document.getElementById('passInput').value === SENHA) {
            document.getElementById('lockScreen').style.display = 'none';
            changeMonth();
        } else {
            document.getElementById('passError').innerText = "Senha incorreta";
        }
    };
    document.getElementById('passInput').addEventListener("keypress", (e) => { if(e.key==="Enter") window.checkPassword() });

    window.switchView = (v) => {
        document.querySelectorAll('.view-section').forEach(e => e.classList.remove('active'));
        document.getElementById('view-'+v).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if(v==='history') loadHistory();
    };

    window.toggleTheme = () => {
        const html = document.documentElement;
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    };

    // --- CARREGAMENTO DE DADOS ---
    window.changeMonth = () => {
        currentDocId = document.getElementById('monthPicker').value;
        if(!currentDocId) return;

        document.getElementById('loadingOverlay').style.display = 'flex';
        isLocked = true; // Bloqueia salvamento

        if(unsubscribe) unsubscribe();

        // Limpa a tela visualmente para não misturar
        resetScreenUI();

        // NOVA COLEÇÃO LIMPA
        unsubscribe = onSnapshot(doc(db, "financas_oficial_v38", currentDocId), (docSnap) => {
            document.getElementById('loadingOverlay').style.display = 'none';
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                window.paidDebtors = data.paidDebtors || [];
                renderData(data);
                document.getElementById('syncStatus').innerText = "Sincronizado";
            } else {
                // Se não existe, renderiza vazio e salva para criar
                renderData(null);
                saveData(true); 
                document.getElementById('syncStatus').innerText = "Novo Mês";
            }
            isLocked = false; // Libera salvamento
        });
    };

    function resetScreenUI() {
        document.getElementById('salary').value = 0;
        document.getElementById('emergency').value = 0;
        document.querySelector('#incomeTable tbody').innerHTML = "";
        document.querySelector('#mainTable tbody').innerHTML = "";
        document.getElementById('cardsContainer').innerHTML = ""; 
        renderCardsHTML(); // Recria a estrutura vazia dos cartões
    }

    function renderData(data) {
        if(!data) data = { salary:0, emergency:0, income:[], fixed:[], cards:{bb:{bill:0,items:[]}, mp:{bill:0,items:[]}, passai:{bill:0,items:[]}, nubank:{bill:0,items:[]}} };

        document.getElementById('salary').value = data.salary;
        document.getElementById('emergency').value = data.emergency;

        // Rendas
        const incBody = document.querySelector('#incomeTable tbody');
        incBody.innerHTML = "";
        if(data.income) data.income.forEach(i => addIncomeRow(i.desc, i.val));

        // Fixos
        const fixBody = document.querySelector('#mainTable tbody');
        fixBody.innerHTML = "";
        if(data.fixed) data.fixed.forEach(i => addMainRow(i.icon, i.name, i.val, i.mine));

        // Cartões
        renderCardsData(data.cards);

        calculate();
    }

    function renderCardsHTML() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = "";
        const cards = [
            {id:'bb', name:'Banco do Brasil', cls:'thumb-bb'},
            {id:'mp', name:'Mercado Pago', cls:'thumb-mp'},
            {id:'passai', name:'Passaí', cls:'thumb-passai'},
            {id:'nubank', name:'Nubank', cls:'thumb-nubank'}
        ];
        cards.forEach(c => {
            container.innerHTML += `
            <div class="section" style="padding:0">
                <div class="card-row">
                    <div class="card-thumb ${c.cls}"></div>
                    <div class="card-info"><h2>${c.name}</h2>Fatura: <input type="number" id="${c.id}Bill" class="input-val" oninput="scheduleSave()"> <div id="${c.id}Share" style="font-size:0.8rem; color:var(--primary); font-weight:bold; margin-top:5px;">Minha: R$ 0</div></div>
                </div>
                <div class="sec-body">
                    <table id="${c.id}Table"><tbody></tbody></table>
                    <button class="btn-action btn-copy" style="width:100%; justify-content:center; margin-top:10px;" onclick="addCardRow('${c.id}')">+ Item</button>
                </div>
            </div>`;
        });
    }

    function renderCardsData(cardsData) {
        if(!cardsData) return;
        for(let id in cardsData) {
            document.getElementById(`${id}Bill`).value = cardsData[id].bill || 0;
            const tbody = document.querySelector(`#${id}Table tbody`);
            tbody.innerHTML = "";
            if(cardsData[id].items) {
                cardsData[id].items.forEach(item => addCardRow(id, item.name, item.desc, item.val));
            }
        }
    }

    // --- CAPTURA E SALVAMENTO ---
    function captureData() {
        const data = {
            salary: document.getElementById('salary').value,
            emergency: document.getElementById('emergency').value,
            paidDebtors: window.paidDebtors,
            income: [],
            fixed: [],
            cards: {
                bb: { bill: document.getElementById('bbBill').value, items: [] },
                mp: { bill: document.getElementById('mpBill').value, items: [] },
                passai: { bill: document.getElementById('passaiBill').value, items: [] },
                nubank: { bill: document.getElementById('nubankBill').value, items: [] }
            }
        };

        // Captura Rendas
        document.querySelectorAll('#incomeTable tbody tr').forEach(tr => {
            data.income.push({
                desc: tr.querySelector('.input-desc').value,
                val: tr.querySelector('.input-val').value
            });
        });

        // Captura Fixos
        document.querySelectorAll('#mainTable tbody tr').forEach(tr => {
            data.fixed.push({
                icon: tr.querySelector('select').value,
                name: tr.querySelector('.input-nome').value,
                val: tr.querySelector('.input-val').value,
                mine: tr.querySelector('input[type="checkbox"]').checked
            });
        });

        // Captura Cartões
        ['bb','mp','passai','nubank'].forEach(id => {
            document.querySelectorAll(`#${id}Table tbody tr`).forEach(tr => {
                data.cards[id].items.push({
                    name: tr.querySelector('.input-nome').value,
                    desc: tr.querySelector('.input-desc').value,
                    val: tr.querySelector('.input-val').value
                });
            });
        });

        return data;
    }

    window.saveData = async (force = false) => {
        if(isLocked && !force) return;
        
        const data = captureData();
        try {
            await setDoc(doc(db, "financas_oficial_v38", currentDocId), data);
            document.getElementById('syncStatus').innerText = "Salvo";
            document.getElementById('saveToast').style.display = "block";
            setTimeout(() => document.getElementById('saveToast').style.display = "none", 2000);
        } catch(e) {
            console.error(e);
            alert("Erro ao salvar!");
        }
    }

    window.scheduleSave = () => {
        if(isLocked) return;
        calculate();
        document.getElementById('syncStatus').innerText = "Editando...";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => saveData(), 1000);
    }

    // --- LÓGICA DE NEGÓCIO ---
    window.calculate = () => {
        let salary = parseFloat(document.getElementById('salary').value)||0;
        let emergency = parseFloat(document.getElementById('emergency').value)||0;
        let incomeTotal = 0;
        let fixedTotal = 0;
        let myFixed = 0;
        
        // Rendas
        document.querySelectorAll('#incomeTable .input-val').forEach(i => incomeTotal += parseFloat(i.value)||0);
        document.getElementById('extraTotal').innerText = fmt(incomeTotal);

        // Fixos
        document.querySelectorAll('#mainTable tbody tr').forEach(tr => {
            let v = parseFloat(tr.querySelector('.input-val').value)||0;
            fixedTotal += v;
            if(tr.querySelector('input[type="checkbox"]').checked) myFixed += v;
        });

        // Cartões
        let cardsMyShareTotal = 0;
        let debtors = {};

        ['bb','mp','passai','nubank'].forEach(id => {
            let bill = parseFloat(document.getElementById(`${id}Bill`).value)||0;
            let others = 0;
            document.querySelectorAll(`#${id}Table tbody tr`).forEach(tr => {
                let v = parseFloat(tr.querySelector('.input-val').value)||0;
                let n = tr.querySelector('.input-nome').value;
                if(v > 0) {
                    others += v;
                    if(n) {
                        let k = n.toLowerCase();
                        if(!debtors[k]) debtors[k] = {name:n, total:0};
                        debtors[k].total += v;
                    }
                }
            });
            let myShare = bill - others;
            cardsMyShareTotal += myShare;
            document.getElementById(`${id}Share`).innerText = "Minha: " + fmt(myShare);
        });

        let totalOut = fixedTotal + cardsMyShareTotal + emergency; // Simplificado: Total Saída = Fixos Totais (assumindo que pago tudo primeiro) + Minha parte cartões + reserva? 
        // Correção lógica comum: Total Saídas geralmente é o que sai da MINHA conta.
        // Se eu pago o fixo inteiro (mesmo que rache), sai da minha conta.
        // Se eu pago a fatura inteira, sai da minha conta.
        // Vamos ajustar para: Total Saídas = Soma Fixos + Soma Faturas Totais + Emergencia.
        
        let realOut = fixedTotal; // Começa com fixos
        ['bb','mp','passai','nubank'].forEach(id => realOut += parseFloat(document.getElementById(`${id}Bill`).value)||0);
        realOut += emergency;

        document.getElementById('totalExpenses').innerText = fmt(realOut);
        document.getElementById('remaining').innerText = fmt((salary + incomeTotal) - realOut);
        
        // Meu Custo Real (Só o que é meu)
        document.getElementById('myRealExpenses').innerText = fmt(myFixed + cardsMyShareTotal);

        updateDebtors(debtors);
        updateChart(realOut, (salary+incomeTotal)-realOut);
    }

    function updateDebtors(debtors) {
        const div = document.getElementById('debtorsList');
        div.innerHTML = "";
        let toRec = 0; let rcv = 0;
        for(let k in debtors) {
            let d = debtors[k];
            let isPaid = window.paidDebtors.includes(d.name);
            if(isPaid) rcv += d.total; else toRec += d.total;
            
            div.innerHTML += `
            <div class="debt-card ${isPaid?'paid':''}" style="background:#fff; padding:15px; border:1px solid #eee; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
                <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>${d.name}</span><span>${fmt(d.total)}</span></div>
                <button class="status-btn ${isPaid?'paid':'pending'}" style="width:100%; margin-top:10px;" onclick="togglePaid('${d.name}')">${isPaid?'✔ PAGO':'⏳ PENDENTE'}</button>
            </div>`;
        }
        document.getElementById('totalReceivable').innerText = fmt(toRec);
        document.getElementById('totalPaid').innerText = fmt(rcv);
    }

    window.togglePaid = (name) => {
        const i = window.paidDebtors.indexOf(name);
        if(i > -1) window.paidDebtors.splice(i,1); else window.paidDebtors.push(name);
        scheduleSave();
    }

    function updateChart(spent, free) {
        const ctx = document.getElementById('chart').getContext('2d');
        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Gastos', 'Livre'], datasets: [{ data: [spent, Math.max(0,free)], backgroundColor: ['#ef4444', '#10b981'], borderWidth:0 }] },
            options: { responsive:true, maintainAspectRatio:false }
        });
    }

    // --- TABELAS UI ---
    window.addIncomeRow = (desc='', val='') => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><input class="input-desc" value="${desc}" oninput="scheduleSave()"></td><td><input type="number" class="input-val" value="${val}" oninput="scheduleSave()"></td><td><button class="btn-del" onclick="this.closest('tr').remove();scheduleSave()">×</button></td>`;
        document.querySelector('#incomeTable tbody').appendChild(tr);
    }
    window.addMainRow = (icon='💸', name='', val='', mine=true) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><select onchange="scheduleSave()"><option ${icon=='💸'?'selected':''}>💸</option><option ${icon=='🏠'?'selected':''}>🏠</option></select></td><td><input class="input-nome" value="${name}" oninput="scheduleSave()"></td><td><input type="number" class="input-val" value="${val}" oninput="scheduleSave()"></td><td style="text-align:center"><input type="checkbox" ${mine?'checked':''} onchange="scheduleSave()"></td><td><button class="btn-del" onclick="this.closest('tr').remove();scheduleSave()">×</button></td>`;
        document.querySelector('#mainTable tbody').appendChild(tr);
    }
    window.addCardRow = (id, name='', desc='', val='') => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><input class="input-nome" placeholder="Nome" value="${name}" oninput="scheduleSave()"></td><td><input class="input-desc" placeholder="Desc" value="${desc}" oninput="scheduleSave()"></td><td></td><td><input type="number" class="input-val" value="${val}" oninput="scheduleSave()"></td><td><button class="btn-del" onclick="this.closest('tr').remove();scheduleSave()">×</button></td>`;
        document.querySelector(`#${id}Table tbody`).appendChild(tr);
    }

    function fmt(n) { return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }

    // --- IMPORTAR (CORREÇÃO DE DADOS SOMEM) ---
    window.copyPreviousMonth = async () => {
        if(!confirm("Importar dados do mês anterior?")) return;
        
        // 1. Calcular Mês Anterior
        const parts = currentDocId.split('-');
        let y = parseInt(parts[0]); let m = parseInt(parts[1]);
        m--; if(m===0){m=12; y--;}
        const prevId = `${y}-${String(m).padStart(2,'0')}`;

        // 2. Buscar Dados
        const snap = await getDoc(doc(db, "financas_oficial_v38", prevId));
        
        if(snap.exists()) {
            const data = snap.data();
            // 3. Limpar status de pagamento
            data.paidDebtors = [];
            
            // 4. GRAVAR DIRETO NO MÊS ATUAL (SEM PASSAR PELA TELA)
            // Isso evita o erro de "renderizar e capturar vazio"
            await setDoc(doc(db, "financas_oficial_v38", currentDocId), data);
            
            // 5. Recarregar a tela
            alert("Dados importados com sucesso!");
            loadMonthData(currentDocId);
        } else {
            alert("Mês anterior não encontrado.");
        }
    }

    // --- OUTROS ---
    window.resetMonth = async () => {
        if(confirm("Zerar tudo?")) {
            await setDoc(doc(db, "financas_oficial_v38", currentDocId), {});
            location.reload();
        }
    }

    window.openPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text(`Relatório ${currentDocId}`, 14, 20);
        // Lógica simples de PDF para evitar erros
        doc.autoTable({ html: '#incomeTable', startY: 30 });
        doc.autoTable({ html: '#mainTable', startY: doc.lastAutoTable.finalY + 10 });
        document.getElementById('pdfPreviewFrame').src = doc.output('bloburl');
        document.getElementById('pdfModal').style.display = 'flex';
        document.getElementById('btnDownloadPDF').onclick = () => doc.save('Relatorio.pdf');
    }
    window.closePDFModal = () => document.getElementById('pdfModal').style.display = 'none';
</script>
</body>
</html>
