<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Financeiro Igor (Final)</title>

    <link rel="apple-touch-icon" href="icone2.0.png">
    <link rel="icon" type="image/png" href="icone2.0.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary: #2563eb; --bg-body: #f8fafc; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
            --success: #10b981; --success-bg: #dcfce7; --success-text: #166534;
            --danger: #ef4444; --warning: #f59e0b; --purple: #8b5cf6;
            --passai: #ea580c; --nubank: #820ad1;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --primary: #60a5fa; --bg-body: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; --border: #334155;
            --success-bg: #064e3b; --success-text: #4ade80;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #sidebar { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; z-index: 100; }
        #main-content { flex: 1; overflow-y: auto; padding: 20px; position: relative; }
        .mobile-toggle { display: none; position: absolute; top: 15px; left: 15px; z-index: 200; background: var(--bg-card); padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: -300px; height: 100%; box-shadow: 2px 0 10px rgba(0,0,0,0.1); transition: 0.3s; }
            #sidebar.active { transform: translateX(300px); }
            .mobile-toggle { display: block; }
            #main-content { padding-top: 60px; }
        }

        .brand { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 12px; width: 100%; text-align: left; font-weight: 600; cursor: pointer; border-radius: 8px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .nav-btn:hover { background: rgba(37, 99, 235, 0.1); color: var(--text-main); }
        .nav-btn.active { background: var(--primary); color: white; }
        .menu-divider { height: 1px; background: var(--border); margin: 15px 0; }
        
        .controls-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .date-control { background: var(--bg-card); border: 1px solid var(--border); padding: 8px 15px; border-radius: 50px; display: flex; align-items: center; gap: 10px; }
        input[type="month"] { background: transparent; border: none; font-weight: 600; color: var(--text-main); }
        
        .btn-action { padding: 8px 16px; border-radius: 50px; border: none; color: white; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-reset { background: #ef4444; } .btn-copy { background: #3b82f6; } .btn-pdf { background: #10b981; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card-stat { background: var(--bg-card); padding: 15px; border-radius: 16px; border: 1px solid var(--border); }
        .card-stat h3 { margin: 0 0 5px 0; font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
        .stat-input { width: 100%; font-size: 1.4rem; font-weight: 800; background: transparent; border: none; border-bottom: 2px dashed var(--border); color: var(--text-main); }
        .val { font-size: 1.4rem; font-weight: 800; }

        .c-salary input { color: var(--success); } .c-total .val { color: var(--danger); }
        .c-rest .val { color: var(--primary); } .c-income .val { color: #059669; }
        .c-mine .val { color: var(--warning); } .c-emerg input { color: var(--purple); }

        .section { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
        .sec-header { padding: 15px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; }
        .sec-body { padding: 15px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
        input.td-input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-body); color: var(--text-main); }
        
        .card-row { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); gap: 15px; }
        .card-thumb { width: 120px; height: 75px; border-radius: 10px; background-size: cover; background-position: center; flex-shrink: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .thumb-bb { background-image: url('bb.jpeg'); }
        .thumb-mp { background-image: url('mp.jpeg'); }
        .thumb-passai { background-image: url('passai.jpeg'); }
        .thumb-nubank { background-image: url('nubank.jpeg'); }

        .view-section { display: none; }
        .view-section.active { display: block; }

        #lockScreen { position: fixed; inset: 0; background: var(--bg-body); z-index: 999; display: flex; align-items: center; justify-content: center; }
        .lock-box { background: var(--bg-card); padding: 40px; border-radius: 20px; text-align: center; border: 1px solid var(--border); }
        .lock-input { padding: 10px; font-size: 1.5rem; text-align: center; margin: 20px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); }

        #pdfModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .pdf-box { width: 90%; height: 90%; background: #fff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .pdf-header { padding: 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; }
        iframe { flex: 1; border: none; }
    </style>
</head>
<body>

<div id="pdfModal"><div class="pdf-box"><div class="pdf-header"><h3>Relatório</h3><div><button class="btn-action btn-pdf" id="btnDownloadPDF">Baixar</button><button class="btn-action btn-reset" onclick="document.getElementById('pdfModal').style.display='none'">Fechar</button></div></div><iframe id="pdfPreviewFrame"></iframe></div></div>
<div id="loadingOverlay"><div class="spinner"></div><div style="font-weight:600; color:#2563eb">Processando...</div></div>

<div id="lockScreen">
    <div class="lock-box">
        <h1>🔒</h1><p>Senha</p>
        <input type="password" id="passInput" class="lock-input" placeholder="PIN" inputmode="numeric">
        <div id="passError" style="color:var(--danger)"></div>
        <button class="btn-action btn-copy" style="width:100%; justify-content:center;" onclick="checkPassword()">Desbloquear</button>
    </div>
</div>

<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')"><span class="material-icons-round">menu</span></button>

<nav id="sidebar">
    <div class="brand"><span class="material-icons-round">account_balance_wallet</span> Financeiro</div>
    <div style="margin-bottom: 20px;">
        <button class="nav-btn" onclick="toggleTheme()"><span class="material-icons-round">dark_mode</span> Tema</button>
        <button class="nav-btn" style="color:var(--danger)" onclick="location.reload()"><span class="material-icons-round">lock</span> Bloquear</button>
    </div>
    <div class="menu-divider"></div>
    <button class="nav-btn active" onclick="switchView('dashboard')">Resumo</button>
    <button class="nav-btn" onclick="switchView('income')">Rendas</button>
    <button class="nav-btn" onclick="switchView('cards')">Cartões</button>
    <button class="nav-btn" onclick="switchView('debts')">Devedores</button>
    <button class="nav-btn" onclick="switchView('history')">Histórico</button>
</nav>

<main id="main-content">
    <div class="controls-row">
        <div class="date-control"><span class="material-icons-round">calendar_today</span><input type="month" id="monthPicker" onchange="changeMonthSafe()"></div>
        <button class="btn-action btn-reset" onclick="resetMonthDefault()">🗑️ Zerar Mês</button>
        <button class="btn-action btn-copy" onclick="copyPreviousMonth()">Importar</button>
        <button class="btn-action btn-pdf" onclick="openPDFPreview()">Relatório</button>
        <div id="syncStatus" style="font-size:0.8rem; font-weight:bold; color:var(--text-muted)">...</div>
    </div>

    <div id="view-dashboard" class="view-section active">
        <div class="dashboard-grid">
            <div class="card-stat c-salary"><h3>Salário</h3><input type="number" id="salary" class="stat-input" value="0" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></div>
            <div class="card-stat c-income"><h3>Extras</h3><div class="val" id="extraIncomeTotal">R$ 0,00</div></div>
            <div class="card-stat c-total"><h3>Saídas</h3><div class="val" id="totalExpenses">R$ 0,00</div></div>
            <div class="card-stat c-rest"><h3>Livre</h3><div class="val" id="remaining">R$ 0,00</div></div>
            <div class="card-stat c-mine"><h3>Meu Custo</h3><div class="val" id="myRealExpenses">R$ 0,00</div></div>
            <div class="card-stat c-emerg"><h3>Reserva</h3><input type="number" id="emergencyFund" class="stat-input" value="0" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></div>
        </div>
        <div class="section"><div class="sec-body" style="height:300px;"><canvas id="expenseChart"></canvas></div></div>
    </div>

    <div id="view-income" class="view-section">
        <div class="section">
            <div class="sec-header"><h2>Entradas Extras</h2></div>
            <div class="sec-body"><table id="incomeTable"><tbody></tbody></table><button style="width:100%; padding:10px; margin-top:10px;" onclick="addIncomeRow()">+ Adicionar</button></div>
        </div>
        <div class="section">
            <div class="sec-header"><h2>Gastos Fixos</h2></div>
            <div class="sec-body"><table id="mainTable"><tbody></tbody></table><button style="width:100%; padding:10px; margin-top:10px;" onclick="addMainRow()">+ Adicionar</button></div>
        </div>
    </div>

    <div id="view-cards" class="view-section">
        <div class="section">
            <div class="card-row"><div class="card-thumb thumb-bb"></div><div class="card-info"><h2>Banco do Brasil</h2>Fatura: <input type="number" id="bbTotalBill" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></div></div>
            <div class="sec-body"><table id="bbTable"><tbody></tbody></table><button style="width:100%; padding:10px;" onclick="addSplitRow('bbTable')">+ Add BB</button></div>
        </div>
        <div class="section">
            <div class="card-row"><div class="card-thumb thumb-mp"></div><div class="card-info"><h2>Mercado Pago</h2>Fatura: <input type="number" id="mpTotalBill" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></div></div>
            <div class="sec-body"><table id="mpTable"><tbody></tbody></table><button style="width:100%; padding:10px;" onclick="addSplitRow('mpTable')">+ Add MP</button></div>
        </div>
        <div class="section">
            <div class="card-row"><div class="card-thumb thumb-passai"></div><div class="card-info"><h2>Passaí</h2>Fatura: <input type="number" id="passaiTotalBill" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></div></div>
            <div class="sec-body"><table id="passaiTable"><tbody></tbody></table><button style="width:100%; padding:10px;" onclick="addSplitRow('passaiTable')">+ Add Passaí</button></div>
        </div>
        <div class="section">
            <div class="card-row"><div class="card-thumb thumb-nubank"></div><div class="card-info"><h2>Nubank</h2>Fatura: <input type="number" id="nubankTotalBill" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></div></div>
            <div class="sec-body"><table id="nubankTable"><tbody></tbody></table><button style="width:100%; padding:10px;" onclick="addSplitRow('nubankTable')">+ Add Nubank</button></div>
        </div>
    </div>

    <div id="view-debts" class="view-section">
        <div class="section"><div class="sec-body" id="debtorsList"></div></div>
    </div>

    <div id="view-history" class="view-section">
        <div class="section"><div class="sec-body" style="height:300px;"><canvas id="historyChart"></canvas></div></div>
    </div>

</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDBcLEJw2PiFoBvocr3Zq01sRjjakteHfs",
        authDomain: "app-controle-gastos-1e658.firebaseapp.com",
        projectId: "app-controle-gastos-1e658",
        storageBucket: "app-controle-gastos-1e658.firebasestorage.app",
        messagingSenderId: "738629744462",
        appId: "1:738629744462:web:f299e491bafe5a059cd01f",
        measurementId: "G-02QPMRE4M8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const SENHA = "1234";

    window.isEditing = false; 
    let currentDocId = "";
    let isReceiving = false;
    let saveTimer;
    let unsubscribe = null;
    let chartInstance = null;
    let barChart = null;
    let pdfDocInstance = null;

    window.paidDebtors = [];
    window.iconsList = ["💸", "🏠", "💡", "💧", "📶", "🏋️", "🚗", "⛽", "🍔", "💇", "💊", "💳", "🎓", "✈️"];

    window.onload = () => {
        const d = new Date();
        const m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        document.getElementById('monthPicker').value = m;
    };

    window.checkPassword = () => {
        if(document.getElementById('passInput').value === SENHA) {
            document.getElementById('lockScreen').style.display = 'none';
            initApp();
        } else document.getElementById('passError').innerText = "Senha incorreta";
    };
    document.getElementById('passInput').addEventListener("keypress", (e)=>{if(e.key==="Enter") window.checkPassword()});

    function initApp() {
        const d = document.getElementById('monthPicker').value;
        loadMonthData(d);
    }

    window.switchView = (v) => {
        document.querySelectorAll('.view-section').forEach(e => e.classList.remove('active'));
        document.getElementById('view-'+v).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if(v === 'history') fetchHistoryData();
    };

    window.toggleTheme = () => {
        const h = document.documentElement;
        h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark');
    };

    // --- LÓGICA SEGURA DE TROCA DE MÊS (DA DANI) ---
    window.changeMonthSafe = async () => {
        const newDate = document.getElementById('monthPicker').value;
        if (!newDate || newDate === currentDocId) return;

        document.getElementById('loadingOverlay').style.display = 'flex';
        
        if (unsubscribe) unsubscribe();
        clearTimeout(saveTimer);

        if (currentDocId && !isReceiving) await saveDataSync(currentDocId); 

        clearScreen();
        loadMonthData(newDate);
    }

    function clearScreen() {
        document.getElementById('salary').value = 0;
        document.getElementById('totalExpenses').innerText = "R$ 0,00";
        document.querySelectorAll('tbody').forEach(b => b.innerHTML = "");
        ['bbTotalBill', 'mpTotalBill', 'passaiTotalBill', 'nubankTotalBill'].forEach(id => document.getElementById(id).value = "");
    }

    function loadMonthData(dateString) {
        currentDocId = dateString;
        document.getElementById('syncStatus').innerText = "Carregando...";
        
        // USA A COLEÇÃO NOVA: carteira_igor_final
        unsubscribe = onSnapshot(doc(db, "carteira_igor_final", currentDocId), (docSnap) => {
            document.getElementById('loadingOverlay').style.display = 'none';
            
            if (docSnap.exists()) {
                if (docSnap.metadata.hasPendingWrites) return; 
                
                if (window.isEditing) return; 

                isReceiving = true;
                const data = docSnap.data();
                window.paidDebtors = data.paidDebtors || []; 
                updateScreen(data);
                
                setTimeout(() => isReceiving = false, 500);
                document.getElementById('syncStatus').innerHTML = '<span style="color:var(--success)">Sincronizado</span>';
            } else { 
                window.paidDebtors = []; 
                const defData = getDefaultData();
                updateScreen(defData); 
                saveDataSync(currentDocId); 
                document.getElementById('syncStatus').innerText = "Novo Mês";
            }
        });
    }

    function getDefaultData() {
        return { 
            salary: 0, emergency: 0, bbTotalBill: 0, mpTotalBill: 0, passaiTotalBill: 0, nubankTotalBill: 0,
            main: [
                { icon: '💳', name: 'Cartão BB', value: 0, isMine: true, locked: true, id: 'bb_auto' },
                { icon: '💳', name: 'Mercado Pago', value: 0, isMine: true, locked: true, id: 'mp_auto' },
                { icon: '💳', name: 'Passaí', value: 0, isMine: true, locked: true, id: 'passai_auto' },
                { icon: '💳', name: 'Nubank', value: 0, isMine: true, locked: true, id: 'nubank_auto' },
                { icon: '🏋️', name: 'Academia', value: 0, isMine: true }, { icon: '💡', name: 'Luz', value: 0, isMine: true }
            ], bb: [], mp: [], passai: [], nubank: [], extraIncome: [], paidDebtors: []
        };
    }

    // --- CAPTURA ESTRUTURADA (IGUAL DANI) ---
    function captureScreenData() {
        const data = { 
            salary: document.getElementById('salary').value, 
            emergency: document.getElementById('emergencyFund').value, 
            bbTotalBill: document.getElementById('bbTotalBill').value, 
            mpTotalBill: document.getElementById('mpTotalBill').value, 
            passaiTotalBill: document.getElementById('passaiTotalBill').value, 
            nubankTotalBill: document.getElementById('nubankTotalBill').value, 
            paidDebtors: window.paidDebtors, 
            main: [], bb: [], mp: [], passai: [], nubank: [], extraIncome: [] 
        };

        document.querySelectorAll('#incomeTable tbody tr').forEach(tr => {
            const inputs = tr.querySelectorAll('input');
            data.extraIncome.push({ desc: inputs[0].value, value: inputs[1].value });
        });

        document.querySelectorAll('#mainTable tbody tr').forEach(tr => { 
            const inputs = tr.querySelectorAll('input');
            const name = inputs[0].value;
            // Filtra cartões automáticos
            const isCard = ['Cartão BB', 'Mercado Pago', 'Passaí', 'Nubank'].includes(name);
            
            data.main.push({ 
                icon: tr.querySelector('.icon-select').value, 
                name: name, 
                value: inputs[1].value, 
                isMine: tr.querySelector('input[type="checkbox"]').checked, 
                locked: inputs[1].hasAttribute('readonly'), 
                id: inputs[1].id || null 
            }); 
        });

        const scrape = (tid, arr) => { document.querySelectorAll(`#${tid} tbody tr`).forEach(tr => { const i = tr.querySelectorAll('input'); arr.push({ name: i[0].value, desc: i[1].value, inst: i[2].value, value: i[3].value }); }); };
        scrape('bbTable', data.bb); scrape('mpTable', data.mp); scrape('passaiTable', data.passai); scrape('nubankTable', data.nubank);
        
        return data;
    }

    async function saveDataSync(targetId) {
        const data = captureScreenData();
        try { await setDoc(doc(db, "carteira_igor_final", targetId), data); } 
        catch(e) { console.error("Erro save sync", e); }
    }

    window.calculateAndSchedule = () => {
        calculateAll();
        if (isReceiving) return;
        document.getElementById('syncStatus').innerText = "...";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => saveDataSync(currentDocId), 1000); 
    }

    window.resetMonthDefault = async () => {
        if(!confirm("Apagar TUDO deste mês?")) return;
        isReceiving = true;
        const def = getDefaultData();
        updateScreen(def);
        await saveDataSync(currentDocId);
        isReceiving = false;
    }

    function updateScreen(data) {
        if (!data) data = getDefaultData();
        // Garante campos
        if (data.main && !data.main.some(i => i.id === 'nubank_auto')) data.main.unshift({ icon: '💳', name: 'Nubank', value: 0, isMine: true, locked: true, id: 'nubank_auto' });

        document.getElementById('salary').value = data.salary || 0;
        document.getElementById('emergencyFund').value = data.emergency || 0;
        document.getElementById('bbTotalBill').value = data.bbTotalBill || 0;
        document.getElementById('mpTotalBill').value = data.mpTotalBill || 0;
        document.getElementById('passaiTotalBill').value = data.passaiTotalBill || 0;
        document.getElementById('nubankTotalBill').value = data.nubankTotalBill || 0;

        renderTable('incomeTable', data.extraIncome, 'income');
        renderTable('mainTable', data.main, 'main');
        renderTable('bbTable', data.bb, 'split');
        renderTable('mpTable', data.mp, 'split');
        renderTable('passaiTable', data.passai, 'split');
        renderTable('nubankTable', data.nubank, 'split');
        
        calculateAll();
    }

    function renderTable(id, list, type) {
        const tbody = document.querySelector(`#${id} tbody`);
        tbody.innerHTML = "";
        if(!list) return;
        list.forEach(item => {
            if(type==='main') addMainRowHTML(tbody, item);
            else if(type==='income') addIncomeRowHTML(tbody, item);
            else addSplitRowHTML(tbody, item);
        });
    }

    window.addMainRow = () => { addMainRowHTML(document.querySelector("#mainTable tbody"), {icon:'💸',name:'',value:'',isMine:true}); calculateAndSchedule(); }
    window.addIncomeRow = () => { addIncomeRowHTML(document.querySelector("#incomeTable tbody"), {desc:'',value:''}); calculateAndSchedule(); }
    window.addSplitRow = (id) => { addSplitRowHTML(document.querySelector(`#${id} tbody`), {name:'',desc:'',inst:'',value:''}); calculateAndSchedule(); }

    function addMainRowHTML(tbody, item) {
        const tr = document.createElement("tr");
        let opts = window.iconsList.map(i => `<option value="${i}" ${i === item.icon ? 'selected' : ''}>${i}</option>`).join('');
        const locked = item.locked ? 'readonly style="background:rgba(0,0,0,0.05); color:#999"' : 'onfocus="window.isEditing=true" onblur="window.isEditing=false"';
        const del = item.locked ? '' : `<button class="btn-del" onclick="removeRow(this)">×</button>`;
        const check = item.isMine ? 'checked' : '';
        tr.innerHTML = `<td><select class="icon-select" ${item.locked?'disabled':''} onchange="calculateAndSchedule()">${opts}</select></td><td><input type="text" class="td-input" value="${item.name}" ${locked} oninput="calculateAndSchedule()"></td><td><input type="number" class="td-input val-input" value="${item.value}" step="0.01" id="${item.id||''}" ${locked} oninput="calculateAndSchedule()"></td><td style="text-align:center"><input type="checkbox" ${check} ${item.locked?'disabled':''} onchange="calculateAndSchedule()"></td><td>${del}</td>`;
        tbody.appendChild(tr);
    }

    function addIncomeRowHTML(tbody, item) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td><input type="text" class="td-input" value="${item.desc}" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></td><td><input type="number" class="td-input val-input" value="${item.value}" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></td><td><button class="btn-del" onclick="removeRow(this)">×</button></td>`;
        tbody.appendChild(tr);
    }

    function addSplitRowHTML(tbody, item) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td><input type="text" class="td-input split-name" value="${item.name}" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></td><td><input type="text" class="td-input" value="${item.desc}" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></td><td><input type="text" class="td-input split-inst" value="${item.inst||''}" placeholder="1/10" oninput="updateBar(this);calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"><div class="prog-bar"><div class="prog-fill"></div></div></td><td><input type="number" class="td-input val-input split-val" value="${item.value}" oninput="calculateAndSchedule()" onfocus="window.isEditing=true" onblur="window.isEditing=false"></td><td><button class="btn-del" onclick="removeRow(this)">×</button></td>`;
        tbody.appendChild(tr);
        if(item.inst) updateBar(tr.querySelector('.split-inst'));
    }

    window.removeRow = (btn) => { btn.closest('tr').remove(); calculateAndSchedule(); }
    window.updateBar = (input) => { const val = input.value; const bar = input.nextElementSibling.querySelector('.prog-fill'); if(val.includes('/')) { const [c,t] = val.split('/').map(Number); if(t>0) bar.style.width = Math.min((c/t)*100, 100)+'%'; } else bar.style.width = '0%'; }
    window.togglePaid = (name) => { const idx = window.paidDebtors.indexOf(name); if(idx>-1) window.paidDebtors.splice(idx,1); else window.paidDebtors.push(name); calculateAndSchedule(); }

    window.calculateAll = () => {
        const bb = processCard('bbTable', 'bbTotalBill', 'bb_auto');
        const mp = processCard('mpTable', 'mpTotalBill', 'mp_auto');
        const passai = processCard('passaiTable', 'passaiTotalBill', 'passai_auto');
        const nubank = processCard('nubankTable', 'nubankTotalBill', 'nubank_auto');

        // Atualiza linhas automáticas
        updateAutoRow('Cartão BB', bb.myShare);
        updateAutoRow('Mercado Pago', mp.myShare);
        updateAutoRow('Passaí', passai.myShare);
        updateAutoRow('Nubank', nubank.myShare);

        let fixedTotal = 0; let myTotal = 0;
        document.querySelectorAll('#mainTable tbody tr').forEach(tr => {
            const val = parseFloat(tr.querySelector('.val-input').value) || 0;
            const isMine = tr.querySelector('input[type="checkbox"]').checked;
            const isAuto = tr.querySelector('.val-input').hasAttribute('readonly');
            
            fixedTotal += val; // Soma tudo no "Total Saídas"
            if(!isAuto && isMine) myTotal += val; // Fixos manuais meus
        });

        // Adiciona cartões ao "Meu Custo Real"
        myTotal += bb.myShare + mp.myShare + passai.myShare + nubank.myShare;

        const emerg = parseFloat(document.getElementById('emergencyFund').value)||0;
        fixedTotal += emerg; // Emergencia entra na saida total

        let income = 0;
        document.querySelectorAll('#incomeTable tbody tr').forEach(tr => income += parseFloat(tr.querySelector('.val-input').value)||0);
        document.getElementById('extraIncomeTotal').innerText = fmt(income);

        const salary = parseFloat(document.getElementById('salary').value)||0;
        const totalInc = salary + income;

        document.getElementById('totalExpenses').innerText = fmt(fixedTotal);
        document.getElementById('remaining').innerText = fmt(totalInc - fixedTotal);
        document.getElementById('myRealExpenses').innerText = fmt(myTotal);

        // Chart e Debtors
        const allDebts = {};
        const merge = (s) => { for(let k in s) { if(!allDebts[k]) allDebts[k]={...s[k]}; else allDebts[k].total+=s[k].total; } };
        merge(bb.debtors); merge(mp.debtors); merge(passai.debtors); merge(nubank.debtors);
        updateDebtors(allDebts);

        const ctx = document.getElementById('expenseChart').getContext('2d');
        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, { type: 'doughnut', data: { labels: ['Saídas', 'Livre'], datasets: [{ data: [fixedTotal, Math.max(0, totalInc-fixedTotal)], backgroundColor: ['#ef4444', '#10b981'], borderWidth:0 }] }, options: { responsive:true, maintainAspectRatio:false } });
    }

    function processCard(tid, totalId, autoName) {
        const bill = parseFloat(document.getElementById(totalId).value)||0;
        let otherSum = 0; let debtors = {};
        document.querySelectorAll(`#${tid} tbody tr`).forEach(tr => {
            const name = tr.querySelector('.split-name').value.trim();
            const val = parseFloat(tr.querySelector('.split-val').value)||0;
            if(val>0) {
                otherSum += val;
                if(name) {
                    const k = name.toLowerCase();
                    if(!debtors[k]) debtors[k] = {name, total:0};
                    debtors[k].total += val;
                }
            }
        });
        return { myShare: bill - otherSum, debtors };
    }

    function updateAutoRow(name, val) {
        const inputs = document.querySelectorAll('#mainTable tbody input[type="text"]');
        for(let inp of inputs) {
            if(inp.value === name) {
                inp.closest('tr').querySelector('.val-input').value = val.toFixed(2);
                break;
            }
        }
    }

    function updateDebtors(all) {
        const list = document.getElementById('debtorsList'); list.innerHTML = "";
        let tr=0, r=0;
        for(let k in all) {
            const p = all[k]; 
            const isPaid = window.paidDebtors.includes(p.name);
            if(isPaid) r+=p.total; else tr+=p.total;
            const div = document.createElement('div'); div.className = `debt-card ${isPaid?'paid':''}`;
            div.innerHTML = `<div class="debt-header"><span>${p.name}</span></div><div class="debt-amount">${fmt(p.total)}</div><div class="debt-footer"><button class="status-btn ${isPaid?'paid':'pending'}" onclick="togglePaid('${p.name}')">${isPaid?'✔ PAGO':'⏳ PENDENTE'}</button></div>`;
            list.appendChild(div);
        }
        document.getElementById('totalToReceive').innerText = fmt(tr);
        document.getElementById('totalReceived').innerText = fmt(r);
    }

    function fmt(n) { return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

    // --- PDF ---
    window.openPDFPreview = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text(`Relatório - ${currentDocId}`, 14, 20);
        
        let y = 30;
        const addTable = (sel, title) => {
            const rows = [];
            document.querySelectorAll(`${sel} tbody tr`).forEach(tr => {
                const i = tr.querySelectorAll('input');
                let n, v;
                if(i.length===2) { n=i[0].value; v=i[1].value; }
                else if(i.length===3) { n=i[0].value; v=i[1].value; }
                else { n=`${i[0].value} ${i[1].value}`; v=i[3].value; }
                if(parseFloat(v)>0) rows.push([n, fmt(parseFloat(v))]);
            });
            if(rows.length>0) {
                doc.text(title, 14, y);
                doc.autoTable({ startY: y+5, head:[['Item','Valor']], body:rows });
                y = doc.lastAutoTable.finalY + 15;
            }
        };

        addTable('#incomeTable', 'Rendas');
        addTable('#mainTable', 'Fixos');
        ['bbTable','mpTable','passaiTable','nubankTable'].forEach(id => addTable(`#${id}`, id.toUpperCase()));

        document.getElementById('pdfPreviewFrame').src = doc.output('bloburl');
        document.getElementById('pdfModal').style.display = 'flex';
        document.getElementById('btnDownloadPDF').onclick = () => doc.save(`Financas_${currentDocId}.pdf`);
    }
    window.closePDFModal = () => document.getElementById('pdfModal').style.display = 'none';

    window.copyPreviousMonth = async function() {
        if(!confirm("Importar mês anterior?")) return;
        const p = currentDocId.split('-'); let y=parseInt(p[0]), m=parseInt(p[1]);
        m--; if(m===0){ m=12; y--; }
        const prevId = `${y}-${String(m).padStart(2,'0')}`;
        const snap = await getDoc(doc(db, "carteira_igor_final", prevId));
        if(snap.exists()) {
            const d = snap.data(); d.paidDebtors = [];
            if(d.main) d.main.forEach(i=>i.paid=false);
            updateScreen(d); setTimeout(()=>saveDataSync(currentDocId),500);
        } else alert("Mês anterior vazio");
    }
</script>
