<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000; /* Fundo preto economiza bateria */
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .item { margin-bottom: 15px; width: 100%; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; margin-bottom: 2px; }
        .value { font-size: 1.6rem; font-weight: 700; }
        
        .green { color: #4ade80; }
        .red { color: #f87171; }
        .blue { color: #60a5fa; }
        .loading { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

    <div id="content" style="display:none;">
        <div class="item">
            <div class="label">Resta</div>
            <div class="value blue" id="resta">R$ 0</div>
        </div>
        <div class="item">
            <div class="label">Gastos Totais</div>
            <div class="value red" id="gastos">R$ 0</div>
        </div>
        <div class="item" style="border:none">
            <div class="label">Meu Custo</div>
            <div class="value green" id="meu">R$ 0</div>
        </div>
    </div>

    <div id="loading" class="loading">Carregando dados...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // SUAS CHAVES AQUI (As mesmas do index.html)
        const firebaseConfig = {
            apiKey: "AIzaSyDBcLEJw2PiFoBvocr3Zq01sRjjakteHfs",
            authDomain: "app-controle-gastos-1e658.firebaseapp.com",
            projectId: "app-controle-gastos-1e658",
            storageBucket: "app-controle-gastos-1e658.firebasestorage.app",
            messagingSenderId: "738629744462",
            appId: "1:738629744462:web:f299e491bafe5a059cd01f",
            measurementId: "G-02QPMRE4M8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Pega data atual
        const now = new Date();
        const docId = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        async function loadData() {
            try {
                const docRef = doc(db, "meus_gastos", docId);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const data = snap.data();
                    
                    // Recalcula Totais (Mesma lógica do app principal simplificada)
                    let total = (parseFloat(data.emergency) || 0) + (parseFloat(data.bbTotal) || 0) + (parseFloat(data.mpTotal) || 0) + (parseFloat(data.passaiTotal) || 0) + (parseFloat(data.nubankTotal) || 0);
                    
                    // Soma itens manuais
                    let myReal = 0;
                    if(data.main) {
                        data.main.forEach(i => {
                            let val = parseFloat(i.value) || 0;
                            // Se não for um dos cartões automáticos
                            if(!['bb_auto','mp_auto','passai_auto','nubank_auto'].includes(i.id)) {
                                total += val;
                            }
                            if(i.isMine) myReal += val;
                        });
                    }

                    // Correção: Para "Meu Custo Real", precisamos somar a parte dos cartões
                    // Mas como é complexo recalcular aqui sem todas as funções, 
                    // vamos focar no TOTAL e RESTA que são mais fáceis.
                    // (O cálculo perfeito exigiria copiar toda aquela lógica JS gigante pra cá)
                    
                    // Simplificação para visualização rápida:
                    // Vamos exibir o SALÁRIO - TOTAL (Resta)
                    
                    const salary = parseFloat(data.salary) || 0;
                    
                    // Recalculo rápido dos totais dos cartões (só o total da fatura)
                    // Nota: O cálculo exato do "Resta" depende da soma das tabelas.
                    // Para ser 100% preciso, precisaríamos da função calculateAll aqui.
                    // Vou assumir que você quer ver se tem dinheiro ou não.
                    
                    // TRUQUE: Vamos ler apenas o que foi salvo no banco?
                    // O banco salva os inputs, não o resultado da conta. 
                    // Então vamos fazer uma conta básica aqui:
                    
                    // Recalculando TOTAL GERAL igual ao index.html
                    let finalTotal = (parseFloat(data.emergency) || 0);
                    
                    // Adiciona itens manuais
                    if (data.main) {
                        data.main.forEach(item => {
                            if (!item.locked) finalTotal += (parseFloat(item.value) || 0);
                        });
                    }
                    
                    // Adiciona Minha Parte dos Cartões (precisa recalcular na hora)
                    const calcCardShare = (totalBill, list) => {
                        let bill = parseFloat(totalBill) || 0;
                        let others = 0;
                        if(list) list.forEach(i => others += (parseFloat(i.value) || 0));
                        return bill - others;
                    };

                    finalTotal += calcCardShare(data.bbTotal, data.bb);
                    finalTotal += calcCardShare(data.mpTotal, data.mp);
                    finalTotal += calcCardShare(data.passaiTotal, data.passai);
                    finalTotal += calcCardShare(data.nubankTotal, data.nubank);

                    const resta = salary - finalTotal;

                    document.getElementById('resta').innerText = resta.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
                    document.getElementById('gastos').innerText = finalTotal.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
                    
                    // "Meu Custo" aproximado (Manual + Cartões)
                    // Para simplificar no relógio, vou omitir ou deixar zerado se for muito complexo
                    // Mas vamos tentar:
                    let myShare = 0;
                    if(data.main) data.main.forEach(i => { if(i.isMine && !i.locked) myShare += parseFloat(i.value)||0; });
                    myShare += calcCardShare(data.bbTotal, data.bb);
                    myShare += calcCardShare(data.mpTotal, data.mp);
                    myShare += calcCardShare(data.passaiTotal, data.passai);
                    myShare += calcCardShare(data.nubankTotal, data.nubank);
                    
                    document.getElementById('meu').innerText = myShare.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    document.getElementById('loading').innerText = "Sem dados este mês.";
                }
            } catch (e) {
                document.getElementById('loading').innerText = "Erro :(";
                console.error(e);
            }
        }

        loadData();
    </script>
</body>
</html>
