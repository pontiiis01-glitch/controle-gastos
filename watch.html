<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* Seletor de Data Estilizado para Watch */
        .date-container {
            width: 100%;
            margin-bottom: 20px;
        }
        input[type="month"] {
            background: #1c1c1e;
            color: #fff;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-size: 1.1rem;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            outline: none;
            box-sizing: border-box;
            color-scheme: dark; /* Força o picker nativo a ser escuro */
        }

        /* Itens */
        .item { margin-bottom: 15px; width: 100%; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .label { font-size: 0.75rem; color: #999; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }
        .value { font-size: 1.8rem; font-weight: 700; }
        
        .green { color: #4ade80; }
        .red { color: #f87171; }
        .blue { color: #60a5fa; }
        .loading { font-size: 0.8rem; color: #666; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="date-container">
        <input type="month" id="monthPicker" onchange="changeMonth()">
    </div>

    <div id="content" style="display:none;">
        <div class="item">
            <div class="label">Resta</div>
            <div class="value blue" id="resta">R$ 0</div>
        </div>
        <div class="item">
            <div class="label">Gastos Totais</div>
            <div class="value red" id="gastos">R$ 0</div>
        </div>
        <div class="item" style="border:none">
            <div class="label">Meu Custo</div>
            <div class="value green" id="meu">R$ 0</div>
        </div>
    </div>

    <div id="loading" class="loading">Carregando...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // SUAS CHAVES (Já configuradas)
        const firebaseConfig = {
            apiKey: "AIzaSyDBcLEJw2PiFoBvocr3Zq01sRjjakteHfs",
            authDomain: "app-controle-gastos-1e658.firebaseapp.com",
            projectId: "app-controle-gastos-1e658",
            storageBucket: "app-controle-gastos-1e658.firebasestorage.app",
            messagingSenderId: "738629744462",
            appId: "1:738629744462:web:f299e491bafe5a059cd01f",
            measurementId: "G-02QPMRE4M8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Inicialização
        window.onload = function() {
            const now = new Date();
            const defaultDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            
            const picker = document.getElementById('monthPicker');
            picker.value = defaultDate;
            
            loadData(defaultDate);
        };

        // Função chamada ao trocar a data
        window.changeMonth = function() {
            const picker = document.getElementById('monthPicker');
            if (picker.value) {
                document.getElementById('content').style.display = 'none';
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerText = "Buscando...";
                loadData(picker.value);
            }
        }

        async function loadData(docId) {
            try {
                const docRef = doc(db, "meus_gastos", docId);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const data = snap.data();
                    
                    const salary = parseFloat(data.salary) || 0;
                    
                    // Cálculo Simplificado para Watch (Lê o total salvo ou recalcula o básico)
                    // Recalcula Totais Gerais baseados nos dados salvos
                    let totalExpenses = (parseFloat(data.emergency) || 0);
                    let myRealExpenses = 0;

                    // Soma manuais
                    if(data.main) {
                        data.main.forEach(i => {
                            const val = parseFloat(i.value) || 0;
                            // Se não for cartão automático, soma no total geral
                            if(!['bb_auto','mp_auto','passai_auto','nubank_auto'].includes(i.id)) {
                                totalExpenses += val;
                            }
                            if(i.isMine) myRealExpenses += val;
                        });
                    }

                    // Função auxiliar para cartões
                    const calcCard = (total, list) => {
                        const bill = parseFloat(total) || 0;
                        let others = 0;
                        if(list) list.forEach(i => others += (parseFloat(i.value) || 0));
                        return bill - others; // Minha parte
                    };

                    // Calcula minha parte dos cartões
                    const bbShare = calcCard(data.bbTotal, data.bb);
                    const mpShare = calcCard(data.mpTotal, data.mp);
                    const passaiShare = calcCard(data.passaiTotal, data.passai);
                    const nubankShare = calcCard(data.nubankTotal, data.nubank);

                    // Soma cartões ao total
                    totalExpenses += bbShare + mpShare + passaiShare + nubankShare;
                    
                    // Ajusta "Meu Custo Real" (Manual + Cartões)
                    // Nota: O loop acima já somou os manuais marcados como "Meu". 
                    // Agora somamos a parte dos cartões (que sempre são "Meus" na lógica do app principal)
                    myRealExpenses += bbShare + mpShare + passaiShare + nubankShare;

                    const remaining = salary - totalExpenses;

                    // Atualiza Tela
                    document.getElementById('resta').innerText = fmt(remaining);
                    document.getElementById('gastos').innerText = fmt(totalExpenses);
                    document.getElementById('meu').innerText = fmt(myRealExpenses);

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    document.getElementById('loading').innerText = "Sem dados neste mês.";
                }
            } catch (e) {
                document.getElementById('loading').innerText = "Erro ao carregar.";
                console.error(e);
            }
        }

        function fmt(n) {
            return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }); // Sem centavos pra caber melhor
        }
    </script>
</body>
</html>
